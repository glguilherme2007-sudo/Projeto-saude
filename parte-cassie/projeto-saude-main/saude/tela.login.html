<!DOCTYPE html>
<html lang="PT-BR">
    <head>
        <meta charset="UTF-8">
        <title>pagina de login</title>
        <link rel="stylesheet" href="estilo/style.css">
    </head>
 <body>
        <main class="caixa-login">
            <fieldset>
                
                    <div id="t1">
                        <h1>Login</h1>
                    </div>
               
                    <div class="caixa-login">
                        <form>
                            <label for="e-mail">e-mail</label>
                            <br>
                            <input 
                            type="email"
                            placeholder="Digite o seu e-mail"
                            name="e-mail"
                            required>
                            <br>
                            <input type="password" value="Digite sua senha" id="isenha" minlength="8" maxlength="20">
                            <label for="isenha">Senha</label> 
                            <br>
                            
                            
                           
                        
                            <input type="submit" value="Enviar">
                    
                        </form>
                        
                    </div>
            
                    <div class="options">
                        <label>
                         <input type="checkbox">
                         salvar login
                        </label>
                        <br>
                    </div>
    
                    <div>
                        <br>
                        <label
                        type="submit">Não possuo uma conta</label>
                        <br>
                        <a href="#">Cadastre-se Aqui</a>
                    </div>
                    <br>
                
            </fildset>
    </main>
  </body>
</html>
