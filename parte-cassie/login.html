<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <title>pagina de login</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>

<body>
    <main>
       <section id="login"> 
              
                <div id="form"> 
                    <h1>login</h1>
                    <p>Seja bem-vindo(a) novamente.<br> 
                        Faça o login para acessar sua conta.</p>
                <form>  
                    <label for="ilogin">Login</label>
                    <input type="email" name="login" id="ilogin" placeholder="Digite o seu e-mail" autocomplete="email" maxlength="30">
                </div>

                <div class="campo">
                     <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha" placeholder="sua senha" autocomplete="current-password" required minlength="8" maxlength="20">  
                </div>

                    <p><input type="submit" value="Entrar"></p>
        
                <p><a href="esqueci.html" class="botao">Esqueci minha senha</a></p>
            </form>
        
        </section> 
    </main>
</body>
