<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo/agend.css">
</head>
<body>
    <div class="ctn">
        <header>
            <div class="bt">
               <h2>Agendamento de consulta - Idade+</h2>

               <nav class="snav" aria-label="Progresso do agendamento">
                    <div class="indic">Passo 1: Quem vai?</div>
                    <div class="indic">Passo 2: Especialidades </div>
                    <div class="indic">Passo 3: Modo </div>
                    <div class="indic">Passo 4: Data e Horario </div>
               </nav>
            </div>
        </header>

        <main>
            <section id="step-1" class="stepctt">
    
                <h3 class="stittle">Passo 1: Quem vai?</h3>
    
                <div class="optiong">
                    <div class="optnc" onclick="selectOpyion(mim)">
                        <div class="icon">👤</div>
                        <span>para mim</span>
                    </div>
    
                    <div>
                        <div class="optnc" onclick="selectOpyion(outro)">
                        <div class="icon">👥</div>
                        <span>para outra pessoa</span>
                        <small>(filho,neto....)</small>
                    </div>
                </div>
            </section>

            <section id="step-2" class="stepctt">
                <h3 class="steptitle">Passo 2: Especialidades</h3>

                <div class="optiong">
                    <div class="optnc" onclick="selectSpeciality('Cardiologia')">
                        <div class="icon">❤️</div>
                        <span>Cardiologia</span>
                    </div>

                    <div class="optnc" onclick="selectSpeciality('Geriatria')">
                        <div class="icon">🩺</div>
                        <span>Geriatria</span>
                    </div>

                    <div class="optnc" onclick="selectSpeciality('Clinico Geral')">
                        <div class="icon">👨‍⚕️</div>
                        <span>Clinico Geral</span>
                    </div>
                </div>
            </section>



        </main>

        <footer>

        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
