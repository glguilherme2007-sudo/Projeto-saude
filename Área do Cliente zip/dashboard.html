
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas Consultas</title>

    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="../estilo/mq.css">

</head>

<body>

    

    <!-- CABEÇALHO -->

    <header class="header">

        <div class="ladoEsquerdo">

           <h1 class="logo-idade-wrap">
            <a href="../index.html" class="logo-idade" aria-label="Página inicial idade+">
            <span class="logo-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
             <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ffffff"/>
            <path d="M6.5 11.5h2.2l1.3-2.5 2.2 5 1.5-2.5h3.8" stroke="#0099ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            </span>
            <span class="logo-texto">idade<span class="logo-mais">+</span></span>
            </a>
        </h1> 

        </div>

            <div class="ladoDireito">
                <div class="user-menu-wrapper">
                    <button type="button" class="user-trigger" id="btnMenuUsuario" aria-expanded="false" aria-label="Abrir menu do usuário">
                        <span class="avatar-bolinha" id="avatarInicial">U</span>
                        <span class="nome-usuario" id="nomeHeader">Usuário</span>
                        <i class="fa-solid fa-chevron-down user-seta" aria-hidden="true"></i>
                    </button>
                    <div class="user-dropdown" id="dropdownUsuario">
                        <button type="button" id="btnSair" class="btn-sair">
                            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                            Sair
                        </button>
                    </div>
                </div>
            </div>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="main">


        <!-- TÍTULO E AGENDAMENTO -->

        <section class="cabecalhoPagina">

            <div class="minhasConsultas">

                <p>
                    Olá, <strong id="nomeSaudacao"></strong>!
                    Acompanhe seus atendimentos.
                </p>

                <h1>Minhas consultas</h1>

            </div>


            <div class="agendamento">

                <a href="../agendar.html">

                    + Agendar Nova Consulta

                </a>

            </div>

        </section>


        <!-- PRÓXIMA CONSULTA -->

        <section class="confirmarPresenca">

            <div class="statusConsulta">

                <p id="proximaconsulta">
                    PRÓXIMA CONSULTA
                </p>

                <p id="aguardandoConfirmacao">
                    Aguardando sua confirmação
                </p>

            </div>


            <div class="especialidade">
                <h2 id="proximaEspecialidade"></h2>
            </div>

            <div class="detalhesConsulta">

                <p id="proximoMedico"></p>

                <p id="proximaData"></p>

                <p id="proximoLocal"></p>

            </div>


            <div class="botaoConsulta">

                <button
                    type="button"
                    id="confirmarPresenca">
                    Confirmar Presença
                </button>

                <button
                    type="button"
                    id="detalhesProxima">
                    Ver Preparo e Detalhes
                </button>

            </div>

        </section>


        <!-- ESTATÍSTICAS -->

        <section class="verificacaoConsultas">

            <div class="cardEstatistica">

                <h2 id="totalAgendadas">0</h2>

                <p>Agendadas</p>

            </div>

            <div class="cardEstatistica">

                <h2 id="totalAguardando">0</h2>

                <p>Aguardando confirmação</p>

            </div>

            <div class="cardEstatistica">

                <h2 id="totalRealizadas">0</h2>

                <p>Realizadas</p>

            </div>

        </section>


        <!-- NAVEGAÇÃO DAS CONSULTAS -->

        <nav class="status" aria-label="Categorias de consultas">

            <button type="button" class="aba ativa"
                data-status="proximas">

                Próximas (<span id="contadorProximas">0</span>)

            </button>

            <button type="button" class="aba"
                data-status="realizadas">

                Realizadas (<span id="contadorRealizadas">0</span>)

            </button>

            <button type="button" class="aba"
                data-status="canceladas">

                Canceladas (<span id="contadorCanceladas">0</span>)

            </button>

        </nav>


        <!-- LISTA DE CONSULTAS -->

        <section class="listaConsulta"
                 id="listaConsulta"
                 aria-label="Lista de consultas">

            <!-- Os cartões serão inseridos pelo JavaScript -->

        </section>


        <!-- MODELO DOS CARTÕES -->

        <template id="modeloConsulta">

            <article class="cartaoConsulta">


                <!-- CABEÇALHO DO CARTÃO -->

                <header class="cabecalhoConsulta">

                    <span class="statusTexto"></span>


                    <p class="dataConsulta">

                        <span data-field="data"></span>

                        <span data-field="horario"></span>

                    </p>

                </header>


                <!-- ESPECIALIDADE -->

                <div class="tipoMedico">

                    <h3 data-field="tipoMedico"></h3>

                </div>


                <!-- INFORMAÇÕES DO MÉDICO -->

                <div class="detalheConsulta">

                    <p data-field="medico"></p>

                    <p data-field="local"></p>

                </div>


                <!-- BOTÕES DE AÇÃO -->

                <div class="botoes">


                    <div class="botoesPrincipais">

                        <button type="button"
                                class="botaoConfirmar"
                                data-action="confirmar">

                            Confirmar

                        </button>


                        <button type="button"
                                class="botaoDetalhes"
                                data-action="detalhes">

                            Detalhes

                        </button>


                        <button type="button"
                                class="botaoRemarcar"
                                data-action="remarcar">

                            Remarcar

                        </button>

                    </div>


                    <button type="button"
                            class="botaoCancelar"
                            data-action="cancelar">

                        Cancelar

                    </button>

                </div>


            </article>

        </template>


    </main>

    <dialog id="modalPersonalizado" class="modal">
        <div class="conteudoModal">

            <div class="iconeModal" id="iconeModal">!</div>

            <h2 id="modalTitulo">Atenção</h2>

            <p id="modalMensagem"></p>

            <input
                type="text"
                id="modalCampo"
                class="campoModal"
                hidden
            >

            <div class="botoesModal">

                <button
                    type="button"
                    id="modalCancelar"
                    class="botaoModal botaoCancelar"
                >
                    Não
                </button>

                <button
                    type="button"
                    id="modalConfirmar"
                    class="botaoModal botaoPrincipal"
                >
                    Entendi
                </button>

            </div>

        </div>
    </dialog>
    
    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

    <aside class="barra-acessibilidade" aria-label="Controles de acessibilidade">
        <button type="button" id="btn-aumentar" title="Aumentar tamanho da fonte" aria-label="Aumentar tamanho da fonte">
            A+
        </button>
        <button type="button" id="btn-diminuir" title="Diminuir tamanho da fonte" aria-label="Diminuir tamanho da fonte">
            A-
        </button>
        <button type="button" id="btn-tema" title="Alternar modo escuro" aria-label="Alternar modo escuro">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18V4c4.41 0 8 3.59 8 8s-3.59 8-8 8z"/>
            </svg>
        </button>
    </aside>
</body>

</html>
