<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário de Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="container">
        <div class="form-img">
            <img src="../cadastro/IMG/logo.png" alt="cadastro">
        </div>
        <div class="form">
            <form action="#">
                <div class="form-hearder">
                    <div class="title">
                        <h1>Cadastre-se</h1>
                    </div>
                    <div class="login-button">
                        <button><a href="#">Entrar</a></button>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-box">
                            <!----------------------->

                        <div class="box">    
                            <label  for="nome">Nome Completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"
                            required>
                        </div>   

                        <div class="box">    
                            <label for="Nascimento">Data de Nascimento</label>
                            <input type="date" id="nascimento" name="nascimento" required>
                        </div>    

                        <div class="box">
                            <label  for="CPF">CPF</label>
                            <input type="number" id="CPF" maxlength="11" placeholder="000.000.000-00" name="CPF"  required>
                        </div>
                            <!--A tag input está com o tipo texto-->
                            
                        <div class="box">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Digite seu e-mail"  required>
                        </div>    

                        <div class="box">
                            <label for="telefone">Telefone</label>
                            <input type="number" id="telefone" name="telefone" maxlength="11 placeholder="(xx)xxxxx-xxxx" required>
                        </div>    

                        <div class="box">    
                            <label for="Senha">Senha</label>
                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                        </div>    


                        <div class="box">
                            <label for="Senha">Confirme sua Senha</label>
                            <input type="password" id="confirmesenha" name="senha" placeholder="Confirme sua senha" required>
                        </div>
                    </div>

                </div>

                <div class="genero-imputs">
                    <div class="genero-titulos">
                        <h6>Gênero</h6>
                    </div>

                    <div class="genero-grupo">
                        <div class="genero-input">
                            <input type="radio" id="feminino" name="genero">
                            <label for="feminino">Feminino</label>

                            <input type="radio" id="masculino" name="genero">
                            <label for="masculino">Masculino</label>

                            <input type="radio" id="outros" name="genero">
                            <label for="outros">Outros</label>

                            <input type="radio" id="none" name="genero">
                            <label for="none">Prefiro não dizer</label>

                        </div>

                    </div>

                </div>
                <div class="continuar-botão">
                    <button><a href="#" >Continuar</a></button>

                </div>
            </form>

        </div>
    </div>
</body>
</html>
