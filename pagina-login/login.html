<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../estilo/mq.css">
</head>
<body>
    <header class="barra-acessibilidade" aria-label="Opções de acessibilidade">
        <button type="button" id="btnVoltar" class="btn btn-outline-light"
            aria-pressed="false">Voltar para Início</button>
        <button type="button" id="btnFonteMenos" class="btn btn-outline-light" aria-label="Diminuir tamanho da fonte">A-</button>
        <button type="button" id="btnFonteMais" class="btn btn-outline-light" aria-label="Aumentar tamanho da fonte">A+</button>
        <button type="button" id="btnContraste" class="btn btn-outline-light" aria-pressed="false">Contraste</button>
    </header>

    <main class="container login-container">
        <div class="row justify-content-center w-100">
            <section class="col-12 col-sm-11 col-md-8 col-lg-6" aria-labelledby="titulo-login">
                <div class="login-box">
                    <h1 id="titulo-login">Login</h1>
                    <p class="subtitulo">Acesse sua conta</p>

                    <form id="formLogin" novalidate>
                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="username" aria-describedby="ajudaCpf erroCpf" required>
                            <small id="ajudaCpf" class="ajuda-cpf">Digite os 11 números; a pontuação é preenchida automaticamente.</small>
                            <span id="erroCpf" class="mensagem-erro" role="alert"></span>
                        </div>

                        <div class="campo">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" minlength="6" maxlength="12" autocomplete="current-password" aria-describedby="erroSenha" required>
                            <span id="erroSenha" class="mensagem-erro" role="alert"></span>
                            <button type="button" id="btnVerSenha" class="btn-ver-senha" aria-pressed="false">Mostrar senha</button>
                        </div>

                        <button type="submit" class="btn-enviar">Enviar</button>
                        <a href="../cadastro/cadastro.html" class="btn-cadastro">Cadastrar Novo Usuário</a>
                        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
                        <div id="senhaEsquecida" class="senha-esquecida">
                            <a href="recuperar_senha.html">Esqueci minha senha</a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
